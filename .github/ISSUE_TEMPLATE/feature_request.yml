name: Feature request
description: Suggest a new component, prop, or enhancement
title: "[Feature] "
labels: ["enhancement"]
type: Feature
assignees: []
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      description: Which package is this request for? Choose "New component" if it doesn't exist yet.
      options:
        - "@rocketcommunicationsinc/astrouxds-nova-react"
        - "@rocketcommunicationsinc/astrouxds-nova-angular"
        - "@rocketcommunicationsinc/astrouxds-nova-react-pro"
        - "@rocketcommunicationsinc/astrouxds-nova-angular-pro"
        - "@rocketcommunicationsinc/astrouxds-nova-icons"
        - "@rocketcommunicationsinc/astrouxds-nova-styles"
        - "@rocketcommunicationsinc/astrouxds-nova-tokens"
        - "@rocketcommunicationsinc/astrouxds-nova-types"
        - "New component"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is, e.g. "I'm always frustrated when..."
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: A clear and concise description of any alternative solutions or features you've considered.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context, mockups, or screenshots about the feature request here.
    validations:
      required: false
